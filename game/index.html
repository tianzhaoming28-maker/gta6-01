<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coral Vice - an open-world crime game in Coral Bay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0b0e1a;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
  }
  canvas {
    width: min(100vw, 177.78vh);
    height: auto;
    aspect-ratio: 16 / 9;
    background: #2e6f9e;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
    cursor: crosshair;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<script src="src/config.js"></script>
<script src="src/rng.js"></script>
<script src="src/input.js"></script>
<script src="src/audio.js"></script>
<script src="src/world.js"></script>
<script src="src/vehicles.js"></script>
<script src="src/traffic.js"></script>
<script src="src/pedestrians.js"></script>
<script src="src/player.js"></script>
<script src="src/police.js"></script>
<script src="src/missions.js"></script>
<script src="src/save.js"></script>
<script src="src/render.js"></script>
<script src="src/hud.js"></script>
<script src="src/shots.js"></script>
<script src="src/main.js"></script>
</body>
</html>
